; Project Sottovoce — export presets. TDD-12 §3.
;
; THE SERVER PRESET'S EXCLUSION LIST IS THE ARCHITECTURE'S PROOF. If the server
; build cannot run a full match with all presentation code excluded, a dependency
; has leaked upward and TDD-01 §1.2 has been violated. That is why the list is
; aggressive rather than convenient.
;
; addons/gut/ is excluded from ALL THREE. A test framework inside a shipped build
; is both a size cost and an attack surface.
;
; scripts/debug/ ships only in the debug client. DebugConsole is an autoload, so
; the export filter is the only thing that keeps it out of players' hands.

[preset.0]

name="Server (Linux headless)"
platform="Linux"
runnable=true
dedicated_server=true
custom_features=""
export_files=PackedStringArray()
export_filter="exclude"
include_filter=""
exclude_filter="scripts/presentation/*, scripts/mirrors/*, scenes/ui/*, addons/gut/*, scripts/debug/*, test/*, tools/*, docs/*, data/tuning/local/*"
export_path="build/linux/sottovoce_server"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

binary_format/embed_pck=true
texture_format/s3tc_bptc=false
texture_format/etc2_astc=false

