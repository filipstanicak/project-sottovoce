# Project Sottovoce — CI
#
# Six required checks on `main` (TDD-12 §1). All six must be green to merge;
# ADR-0009 forbids direct pushes to main.
#
# `import` runs first because everything else depends on a clean import, and
# import errors are the most common cause of works-on-my-machine.
#
# Engine version is pinned by .godot-version (ADR-0011). CI installs exactly
# that build — a CI that installs "latest" is background drift with extra steps.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- version --
  # Single source of truth for the engine version, read once and reused.
  version:
    name: resolve engine version
    runs-on: ubuntu-22.04
    outputs:
      godot: ${{ steps.pin.outputs.godot }}
      tag: ${{ steps.pin.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: pin
        run: |
          FULL=$(tr -d '[:space:]' < .godot-version)
          # 4.7.1.stable.official.<hash>  ->  4.7.1  /  4.7.1-stable
          SEMVER=$(echo "$FULL" | cut -d. -f1-3)
          echo "godot=$SEMVER" >> "$GITHUB_OUTPUT"
          echo "tag=$SEMVER-stable" >> "$GITHUB_OUTPUT"
          echo "Pinned engine: $FULL (download tag $SEMVER-stable)"

  # ----------------------------------------------------------------- import --
  import:
    name: import
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with: { lfs: true }

      - uses: ./.github/actions/setup-godot
        with: { tag: '${{ needs.version.outputs.tag }}' }

      # Saved here, restored read-only by `test`. Passing it as an artifact
      # instead does not work: `.godot` is a hidden path and upload-artifact
      # silently skips hidden files, so the upload produced nothing and the
      # download in `test` then hard-failed. A cache miss is merely slower.
      - name: Cache import artefacts
        uses: actions/cache@v6
        with:
          path: .godot
          key: import-${{ needs.version.outputs.tag }}-${{ hashFiles('project.godot', '**/*.import') }}

      # TDD-12 §12: ≤ 90 s. Above ~2 min it stops being a fast gate.
      - name: Headless import
        timeout-minutes: 5
        run: godot --headless --editor --quit-after 200

  # ------------------------------------------------------------------- lint --
  lint:
    name: lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }

      - name: Install gdtoolkit
        run: pip install --quiet "gdtoolkit==4.*"

      # No .gd files exist yet at M0. Skip cleanly rather than failing on an
      # empty glob — a job that fails when there is nothing to check teaches
      # people to ignore it.
      - name: gdlint
        run: |
          set -euo pipefail
          if compgen -G "scripts/**/*.gd" > /dev/null || compgen -G "test/**/*.gd" > /dev/null; then
            gdlint scripts/ test/ tools/
          else
            echo "no .gd files yet — skipping"
          fi

      - name: gdformat --check
        run: |
          set -euo pipefail
          if compgen -G "scripts/**/*.gd" > /dev/null || compgen -G "test/**/*.gd" > /dev/null; then
            gdformat --check scripts/ test/ tools/
          else
            echo "no .gd files yet — skipping"
          fi

  # --------------------------------------------------------------- ip-guard --
  # HARD failure. See docs/00_meta/IP_GUARDRAILS.md §6.1.
  ip-guard:
    name: ip-guard
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - run: bash .ci/ip_guard.sh

  # -------------------------------------------------------- asset-inventory --
  # Bidirectional: a stale row is as much a defect as a missing one.
  asset-inventory:
    name: asset-inventory
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - run: bash .ci/check_asset_inventory.sh

  # ------------------------------------------------------------------- test --
  test:
    name: test
    needs: [version, import]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with: { lfs: true }

      - uses: ./.github/actions/setup-godot
        with: { tag: '${{ needs.version.outputs.tag }}' }

      # Restore-only: `import` owns writing this key. A miss is not an error —
      # Godot simply re-imports, costing time rather than correctness.
      - name: Restore import artefacts
        uses: actions/cache/restore@v6
        with:
          path: .godot
          key: import-${{ needs.version.outputs.tag }}-${{ hashFiles('project.godot', '**/*.import') }}

      # test/arch/ protects the architecture rather than behaviour. If one of
      # these fails, the change is wrong or an ADR is needed — never the test.
      - name: Architecture guards
        run: |
          set -euo pipefail
          if [ -d addons/gut ]; then
            godot --headless -s addons/gut/gut_cmdln.gd -gdir=res://test/arch -gexit
          else
            echo "GUT not installed yet (arrives with US-0005) — skipping"
          fi

      - name: Unit tests
        run: |
          set -euo pipefail
          if [ -d addons/gut ]; then
            godot --headless -s addons/gut/gut_cmdln.gd -gdir=res://test/unit -gexit
          else
            echo "GUT not installed yet — skipping"
          fi

  # ----------------------------------------------------------------- export --
  export:
    name: export
    needs: [version, import]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with: { lfs: true }

      - uses: ./.github/actions/setup-godot
        with: { tag: '${{ needs.version.outputs.tag }}' }

      # The server preset's exclusion list is the architecture's proof: if the
      # server build cannot run with all presentation code excluded, a
      # dependency has leaked upward (TDD-01 §1.2).
      - name: Verify export presets
        run: |
          set -euo pipefail
          if [ -f export_presets.cfg ]; then
            grep -q 'scripts/presentation' export_presets.cfg \
              || { echo "server preset must exclude scripts/presentation/"; exit 1; }
            grep -q 'addons/gut' export_presets.cfg \
              || { echo "every preset must exclude addons/gut/"; exit 1; }
            echo "export presets present and excluding correctly"
          else
            echo "export_presets.cfg not created yet (arrives with US-0012) — skipping"
          fi
