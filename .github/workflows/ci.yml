# Project Sottovoce — required CI.
# Keep the seven displayed job names aligned with .github/main-ruleset.json.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: resolve engine version
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate engine pin and checksum
        shell: bash
        run: |
          set -euo pipefail
          source <(bash .ci/resolve_godot_pin.sh)
          echo "Pinned engine: $GODOT_FULL"
          echo "Download: $GODOT_ARCHIVE ($GODOT_SHA256)"

  import:
    name: import
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - uses: ./.github/actions/setup-godot
      - name: Cache imported project
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .godot
          key: godot-import-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.godot-version', 'project.godot', 'addons/**', 'assets/**', 'data/**', 'scenes/**', 'scripts/**', 'test/**', 'tools/**') }}
      - name: Import project
        run: godot --headless --path . --editor --quit-after 200
      - name: Verify generated resources
        run: bash .ci/check_generated_resources.sh

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .ci/requirements.txt
      - name: Install lint tools
        run: pip install --requirement .ci/requirements.txt
      - name: Validate shell scripts
        run: bash -n .ci/*.sh
      - name: Lint GDScript
        run: gdlint scripts/ test/ tools/
      - name: Check GDScript formatting
        run: gdformat --check scripts/ test/ tools/
      - name: Verify generated code
        run: bash .ci/check_generated_code.sh

  ip-guard:
    name: ip-guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash .ci/ip_guard.sh

  asset-inventory:
    name: asset-inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash .ci/check_asset_inventory.sh

  test-core:
    name: test / architecture + unit
    needs: import
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - uses: ./.github/actions/setup-godot
      - name: Restore imported project
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .godot
          key: godot-import-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.godot-version', 'project.godot', 'addons/**', 'assets/**', 'data/**', 'scenes/**', 'scripts/**', 'test/**', 'tools/**') }}
      - name: Reconcile imports
        run: godot --headless --path . --editor --quit-after 200
      - name: Architecture guards
        run: bash .ci/run_gut.sh test/arch "architecture guards"
      - name: Unit tests
        run: bash .ci/run_gut.sh test/unit "unit tests"

  test-integration:
    name: test / integration
    needs: import
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - uses: ./.github/actions/setup-godot
      - name: Restore imported project
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .godot
          key: godot-import-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.godot-version', 'project.godot', 'addons/**', 'assets/**', 'data/**', 'scenes/**', 'scripts/**', 'test/**', 'tools/**') }}
      - name: Reconcile imports
        run: godot --headless --path . --editor --quit-after 200
      - name: Integration tests
        run: bash .ci/run_gut.sh test/integration "integration tests"

  test:
    name: test
    if: ${{ always() }}
    needs: [test-core, test-integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require both test partitions
        env:
          CORE_RESULT: ${{ needs.test-core.result }}
          INTEGRATION_RESULT: ${{ needs.test-integration.result }}
        run: |
          test "$CORE_RESULT" = success
          test "$INTEGRATION_RESULT" = success

  export:
    name: export
    needs: import
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - uses: ./.github/actions/setup-godot
      - name: Restore imported project
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .godot
          key: godot-import-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.godot-version', 'project.godot', 'addons/**', 'assets/**', 'data/**', 'scenes/**', 'scripts/**', 'test/**', 'tools/**') }}
      - name: Reconcile imports
        run: godot --headless --path . --editor --quit-after 200
      - name: Export release packs and boot server
        run: bash .ci/export_packs.sh
