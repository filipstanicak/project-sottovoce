name: Setup pinned Godot
description: Install and verify the exact Godot build pinned by the repository.

runs:
  using: composite
  steps:
    - id: pin
      name: Resolve repository pin
      shell: bash
      run: |
        set -euo pipefail
        source <(bash .ci/resolve_godot_pin.sh)
        echo "full=$GODOT_FULL" >> "$GITHUB_OUTPUT"
        echo "tag=$GODOT_TAG" >> "$GITHUB_OUTPUT"
        echo "archive=$GODOT_ARCHIVE" >> "$GITHUB_OUTPUT"
        echo "sha256=$GODOT_SHA256" >> "$GITHUB_OUTPUT"

    - name: Cache engine
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/godot/${{ steps.pin.outputs.tag }}
        key: godot-${{ runner.os }}-${{ runner.arch }}-${{ steps.pin.outputs.tag }}-${{ steps.pin.outputs.sha256 }}

    - name: Install and verify engine
      shell: bash
      env:
        GODOT_ARCHIVE: ${{ steps.pin.outputs.archive }}
        GODOT_FULL: ${{ steps.pin.outputs.full }}
        GODOT_SHA256: ${{ steps.pin.outputs.sha256 }}
        GODOT_TAG: ${{ steps.pin.outputs.tag }}
      run: |
        set -euo pipefail
        engine_dir="$HOME/godot/$GODOT_TAG"
        engine="$engine_dir/godot"
        if [ ! -x "$engine" ]; then
          echo "engine cache miss — downloading $GODOT_TAG"
          mkdir -p "$engine_dir"
          archive="$RUNNER_TEMP/$GODOT_ARCHIVE"
          curl --fail --location --retry 3 --retry-all-errors \
            "https://github.com/godotengine/godot/releases/download/$GODOT_TAG/$GODOT_ARCHIVE" \
            --output "$archive"
          printf '%s  %s\n' "$GODOT_SHA256" "$archive" | sha256sum --check --strict
          unzip -q "$archive" -d "$engine_dir"
          mv "$engine_dir"/Godot_v*_linux.x86_64 "$engine"
          chmod +x "$engine"
        fi
        actual="$($engine --version | tr -d '[:space:]')"
        if [ "$actual" != "$GODOT_FULL" ]; then
          echo "setup-godot: expected $GODOT_FULL, got $actual" >&2
          exit 1
        fi
        echo "$engine_dir" >> "$GITHUB_PATH"
        echo "verified Godot $actual"
